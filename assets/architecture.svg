<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 460" width="1120" height="460" role="img" aria-label="Senato Multi-Seat Trade-Off Deliberation Architecture Diagram">
  <defs>
    <linearGradient id="bgParchment" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAF6EE"/>
      <stop offset="100%" stop-color="#EFE6D5"/>
    </linearGradient>
    <marker id="arrowSepia" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#6A5B4B"/>
    </marker>
    <marker id="arrowCrimson" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8E2F21"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2F5D62"/>
    </marker>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#2B2118" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Parchment Background & Codex Double Frame -->
  <rect x="0" y="0" width="1120" height="460" rx="10" fill="url(#bgParchment)"/>
  <rect x="12" y="12" width="1096" height="436" rx="6" fill="none" stroke="#C9B99B" stroke-width="1.5"/>
  <rect x="17" y="17" width="1086" height="426" rx="4" fill="none" stroke="#DED2BC" stroke-width="0.8"/>

  <!-- Codex Corner Ornaments -->
  <g stroke="#B8A482" stroke-width="1" fill="none" opacity="0.85">
    <path d="M24,36 L24,24 L36,24"/>
    <path d="M1096,36 L1096,24 L1084,24"/>
    <path d="M24,424 L24,436 L36,436"/>
    <path d="M1096,424 L1096,436 L1084,436"/>
  </g>

  <!-- Header -->
  <text x="44" y="49" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="bold" fill="#2B2118">
    Senato Architecture: Asymmetric Evidence Seats &amp; Anti-Conformity Deliberation
  </text>
  <text x="44" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="12.2" fill="#635647">
    Optional project overlay or dynamic stakeholder selection · Shared Block A + asymmetric Block B · Blind R1 → Conditional anonymized R2 · Proposed decision record
  </text>

  <!-- Column Stage Labels -->
  <g font-family="system-ui, sans-serif" font-size="10.2" font-weight="700" fill="#8C7B65" letter-spacing="0.8">
    <text x="128" y="102" text-anchor="middle">1 · AGENDA &amp; OVERLAY</text>
    <text x="372" y="102" text-anchor="middle" fill="#2F5D62">2 · ASYMMETRIC PACKETS</text>
    <text x="646" y="102" text-anchor="middle" fill="#8E2F21">3 · BLIND R1 &amp; CONDITIONAL R2</text>
    <text x="954" y="102" text-anchor="middle">4 · DECISION RECORD</text>
  </g>

  <!-- STAGE 1: Agenda & Overlay -->
  <g transform="translate(34, 118)">
    <rect x="0" y="0" width="188" height="238" rx="7" fill="#FFFDF8" stroke="#8C7B65" stroke-width="1.6" filter="url(#cardShadow)"/>
    <text x="94" y="27" font-family="Georgia, serif" font-size="13.4" font-weight="bold" fill="#2B2118" text-anchor="middle">Contested Trade-Off</text>
    <line x1="16" y1="38" x2="172" y2="38" stroke="#E3D8C5" stroke-width="1"/>
    <text x="16" y="59" font-family="system-ui, sans-serif" font-size="10.4" font-weight="700" fill="#2F5D62">4-Layer Config Precedence</text>
    <text x="16" y="77" font-family="system-ui, sans-serif" font-size="10.2" fill="#4E4235">1. CLI / call flags</text>
    <text x="16" y="94" font-family="system-ui, sans-serif" font-size="10.2" fill="#4E4235">2. .agents/senato_rules.md</text>
    <text x="16" y="111" font-family="system-ui, sans-serif" font-size="10.2" fill="#4E4235">3. ~/.config/senato/config</text>
    <text x="16" y="128" font-family="system-ui, sans-serif" font-size="10.2" fill="#4E4235">4. Core dynamic defaults</text>
    <rect x="14" y="144" width="160" height="78" rx="5" fill="#F2F7F7" stroke="#2F5D62" stroke-width="1"/>
    <text x="94" y="162" font-family="system-ui, sans-serif" font-size="10.1" font-weight="700" fill="#1F4246" text-anchor="middle">Dynamic Seat Selection</text>
    <text x="94" y="179" font-family="system-ui, sans-serif" font-size="9.6" fill="#3B5356" text-anchor="middle">No config? Orchestrator picks</text>
    <text x="94" y="193" font-family="system-ui, sans-serif" font-size="9.6" fill="#3B5356" text-anchor="middle">3–4 colliding stakeholder axes</text>
    <text x="94" y="207" font-family="system-ui, sans-serif" font-size="9.6" fill="#3B5356" text-anchor="middle">+ mandatory Defer baseline</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="224" y1="237" x2="254" y2="237" stroke="#6A5B4B" stroke-width="1.6" marker-end="url(#arrowSepia)"/>

  <!-- STAGE 2: Block A + Asymmetric Block B -->
  <g transform="translate(260, 118)">
    <!-- Block A Shared Top Banner -->
    <rect x="0" y="0" width="224" height="62" rx="6" fill="#FFFDF8" stroke="#5C4E3F" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="112" y="21" font-family="Georgia, serif" font-size="12.2" font-weight="bold" fill="#2B2118" text-anchor="middle">Block A · Shared Hard Invariants</text>
    <text x="112" y="37" font-family="system-ui, sans-serif" font-size="9.8" fill="#5C4E3F" text-anchor="middle">Identical for all seats (≤600 tokens)</text>
    <text x="112" y="51" font-family="system-ui, sans-serif" font-size="9.5" fill="#7D6B57" text-anchor="middle">Options · Hard limits · Grounds all seats</text>

    <!-- 3 Asymmetric Block B Seat Cards -->
    <g transform="translate(0, 74)">
      <rect x="0" y="0" width="224" height="48" rx="5" fill="#F2F7F7" stroke="#2F5D62" stroke-width="1.4"/>
      <rect x="0" y="0" width="6" height="48" rx="2" fill="#2F5D62"/>
      <text x="16" y="19" font-family="system-ui, sans-serif" font-size="10.4" font-weight="700" fill="#1F4246">Seat 1 · Axis + Evidence Slice B1</text>
      <text x="16" y="36" font-family="system-ui, sans-serif" font-size="9.5" fill="#466063">e.g. Integrity · &lt;untrusted_repo_evidence&gt;</text>
    </g>
    <g transform="translate(0, 130)">
      <rect x="0" y="0" width="224" height="48" rx="5" fill="#FDF5F3" stroke="#8E2F21" stroke-width="1.4"/>
      <rect x="0" y="0" width="6" height="48" rx="2" fill="#8E2F21"/>
      <text x="16" y="19" font-family="system-ui, sans-serif" font-size="10.4" font-weight="700" fill="#8E2F21">Seat 2 · Axis + Evidence Slice B2</text>
      <text x="16" y="36" font-family="system-ui, sans-serif" font-size="9.5" fill="#633A33">e.g. Market / UX · Falsification burden</text>
    </g>
    <g transform="translate(0, 186)">
      <rect x="0" y="0" width="224" height="48" rx="5" fill="#FAF6EE" stroke="#8C7B65" stroke-width="1.4"/>
      <rect x="0" y="0" width="6" height="48" rx="2" fill="#5C4E3F"/>
      <text x="16" y="19" font-family="system-ui, sans-serif" font-size="10.4" font-weight="700" fill="#3E3226">Seat 3 · Axis + Evidence Slice B3</text>
      <text x="16" y="36" font-family="system-ui, sans-serif" font-size="9.5" fill="#5C4E3F">e.g. Delivery / Economics · Steelman Defer</text>
    </g>
  </g>

  <!-- Arrows 2 -> 3 -->
  <line x1="486" y1="216" x2="516" y2="216" stroke="#2F5D62" stroke-width="1.5" marker-end="url(#arrowTeal)"/>
  <line x1="486" y1="272" x2="516" y2="272" stroke="#8E2F21" stroke-width="1.5" marker-end="url(#arrowCrimson)"/>
  <line x1="486" y1="328" x2="516" y2="328" stroke="#6A5B4B" stroke-width="1.5" marker-end="url(#arrowSepia)"/>

  <!-- STAGE 3: Blind R1 + Conditional Anonymized R2 -->
  <g transform="translate(522, 118)">
    <rect x="0" y="0" width="250" height="238" rx="7" fill="#FDF5F3" stroke="#8E2F21" stroke-width="1.8" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="8" height="238" rx="3" fill="#8E2F21"/>
    <text x="20" y="25" font-family="Georgia, serif" font-size="13.2" font-weight="bold" fill="#8E2F21">Round 1 · Parallel Blind</text>
    <text x="20" y="42" font-family="system-ui, sans-serif" font-size="9.9" font-weight="600" fill="#B83B2A">Zero cross-talk · ≤400w · Flip Conditions</text>
    <line x1="20" y1="51" x2="234" y2="51" stroke="#E8C6BF" stroke-width="1"/>
    <text x="20" y="69" font-family="system-ui, sans-serif" font-size="10.1" fill="#4A2A25">• Stance + ≤3 grounded evidence citations</text>
    <text x="20" y="86" font-family="system-ui, sans-serif" font-size="10.1" fill="#4A2A25">• Fatal flaw of leading alternative</text>
    <text x="20" y="103" font-family="system-ui, sans-serif" font-size="10.1" fill="#4A2A25">• Batch audits: 1-line &lt;ID&gt;: keep fast-track</text>

    <!-- Gate Pill -->
    <rect x="18" y="114" width="216" height="32" rx="5" fill="#FFFDF8" stroke="#2F5D62" stroke-width="1.2"/>
    <text x="126" y="128" font-family="system-ui, sans-serif" font-size="9.7" font-weight="700" fill="#1F4246" text-anchor="middle">3:0 Clean Consensus? → Skip Round 2</text>
    <text x="126" y="141" font-family="system-ui, sans-serif" font-size="9.2" fill="#527073" text-anchor="middle">Split or High-Severity Risk → Trigger Round 2</text>

    <!-- Round 2 Box -->
    <rect x="18" y="154" width="216" height="72" rx="5" fill="#FFFFFF" stroke="#8E2F21" stroke-width="1.2"/>
    <text x="126" y="171" font-family="Georgia, serif" font-size="11.4" font-weight="bold" fill="#8E2F21" text-anchor="middle">Round 2 · Anonymized Cross-Review</text>
    <text x="126" y="187" font-family="system-ui, sans-serif" font-size="9.6" fill="#4A2A25" text-anchor="middle">Position Alpha / Beta / Gamma (labels stripped)</text>
    <text x="126" y="202" font-family="system-ui, sans-serif" font-size="9.6" fill="#4A2A25" text-anchor="middle">SWITCH requires refuted R1 Flip Condition</text>
    <text x="126" y="217" font-family="system-ui, sans-serif" font-size="9.4" font-weight="700" fill="#B83B2A" text-anchor="middle">Unsupported flip → Unexplained Drift</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="774" y1="237" x2="808" y2="237" stroke="#8E2F21" stroke-width="1.8" marker-end="url(#arrowCrimson)"/>

  <!-- STAGE 4: 4-Field Decision Record & Human Gate -->
  <g transform="translate(816, 118)">
    <rect x="0" y="0" width="270" height="238" rx="7" fill="#FFFDF8" stroke="#3E2F23" stroke-width="1.8" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="270" height="44" rx="7" fill="#8E2F21"/>
    <rect x="0" y="34" width="270" height="10" fill="#8E2F21"/>
    <text x="135" y="20" font-family="Georgia, serif" font-size="13.2" font-weight="bold" fill="#FAF6EE" text-anchor="middle">4-Field Decision Record</text>
    <text x="135" y="36" font-family="system-ui, sans-serif" font-size="9.5" fill="#F2D7CF" text-anchor="middle">STATUS: PROPOSED · Requires Human Approval</text>

    <text x="16" y="65" font-family="system-ui, sans-serif" font-size="10.2" font-weight="700" fill="#2F5D62">Provenance Header (Honest Disclosure)</text>
    <text x="16" y="81" font-family="system-ui, sans-serif" font-size="9.6" fill="#4E4235">Mode · Backends · Quorum · Per-Seat Slices</text>
    <line x1="16" y1="90" x2="254" y2="90" stroke="#E3D8C5" stroke-width="1"/>
    <text x="16" y="109" font-family="system-ui, sans-serif" font-size="10.3" fill="#2B2118"><tspan font-weight="700">1. What:</tspan> Recommended option + guardrails</text>
    <text x="16" y="128" font-family="system-ui, sans-serif" font-size="10.3" fill="#2B2118"><tspan font-weight="700">2. Why:</tspan> Grounded evidence + vote table</text>
    <text x="16" y="147" font-family="system-ui, sans-serif" font-size="10.3" fill="#2B2118"><tspan font-weight="700">3. Dissent:</tspan> Rejected alts + preserved minority</text>
    <text x="16" y="166" font-family="system-ui, sans-serif" font-size="10.3" fill="#2B2118"><tspan font-weight="700">4. Reversal:</tspan> Measurable overturn triggers</text>
    <rect x="14" y="182" width="242" height="42" rx="5" fill="#F2F7F7" stroke="#2F5D62" stroke-width="1.1"/>
    <text x="135" y="199" font-family="system-ui, sans-serif" font-size="9.9" font-weight="700" fill="#1F4246" text-anchor="middle">Strictly Read-Only Over Production Code</text>
    <text x="135" y="214" font-family="system-ui, sans-serif" font-size="9.3" fill="#466063" text-anchor="middle">0 source edits · 0 commits · Human holds final sign-off</text>
  </g>

  <!-- Bottom Execution Backend Strip -->
  <g transform="translate(34, 374)">
    <rect x="0" y="0" width="1052" height="52" rx="6" fill="#FAF6EE" stroke="#C9B99B" stroke-width="1.2"/>
    <text x="20" y="21" font-family="system-ui, sans-serif" font-size="10.3" font-weight="700" fill="#8E2F21">HYBRID EXECUTION TIERS</text>
    <text x="20" y="39" font-family="system-ui, sans-serif" font-size="10.0" fill="#4E4235">
      <tspan font-weight="700" fill="#2F5D62">Tier 1 (Multi-CLI Cross-Model):</tspan> scripts/dispatch.py · empty temp cwd · write-flag block · git diff guard · honest Quorum
    </text>
    <text x="640" y="39" font-family="system-ui, sans-serif" font-size="10.0" fill="#4E4235">
      <tspan font-weight="700" fill="#5C4E3F">Tier 0 (Single-Host):</tspan> fresh non-fork subagents + explicit NOT Cross-Model banner
    </text>
  </g>
</svg>
